{% extends 'index.html' %}
{% load static %}

{% block title %}Equipe{% endblock %}

{% block content %}

<section class="equipe">

    {% for j in jogador %}
    <div class="card">
        <h2>{{ j.nome }}</h2>
        <p>{{ j.posicao }}</p>
        <p>{{ j.idade }}</p>

        {% if j.foto %}
            <img src="{{ j.foto.url }}" alt="{{ j.nome }}">
        {% else %}
            <img src="{% static 'img/default.png' %}" alt="Sem foto">
        {% endif %}
    </div>
    {% empty %}
        <p>Nenhum jogador cadastrado no momento.</p>
    {% endfor %}

</section>

{% endblock %}
